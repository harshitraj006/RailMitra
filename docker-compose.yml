version: "3.8"

services:
  db:
    image: postgres:16-alpine
    container_name: railmitra_postgres
    restart: always
    environment:
      POSTGRES_USER: railmitra
      POSTGRES_PASSWORD: railmitra_password
      POSTGRES_DB: railmitra
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U railmitra -d railmitra"]
      interval: 5s
      timeout: 5s
      retries: 5

  # To run the FastAPI app with PostgreSQL, set in .env:
  # DATABASE_URL=postgresql+asyncpg://railmitra:railmitra_password@localhost:5432/railmitra

volumes:
  postgres_data:
